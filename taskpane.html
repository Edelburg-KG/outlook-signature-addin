<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signatur</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <style>
    :root {
      --ink: #201f1c;
      --muted: #5c5850;
      --gold: #ab9569;
      --green: #17241e;
      --line: #ddd6c6;
      --paper: #ffffff;
      --wash: #f7f4ec;
      --error: #a4262c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }
    h1 {
      margin: 0 0 4px;
      font: bold 18px/1.25 Georgia, "Times New Roman", serif;
    }
    .hint {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .status {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .status.ok { color: var(--green); font-weight: 600; }
    .status.error { color: var(--error); }
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .card:hover:not(:disabled) { border-color: var(--gold); background: var(--wash); }
    .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .card:disabled { cursor: default; opacity: 0.6; }
    .card.inserted { border: 2px solid var(--green); padding: 9px; }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .label { font-weight: 600; }
    .badge {
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--green);
      color: #f4efe1;
      font-size: 11px;
    }
    .done {
      margin-left: auto;
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
    }
    .card:not(.inserted) .done { display: none; }
    /* Shadow host for the signature preview; taskpane.js scales it down to
       the pane's width and sets its height. */
    .preview {
      display: block;
      overflow: hidden;
      pointer-events: none;
    }
    .preview-missing {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- Text is filled in by taskpane.js in the manifest's language. -->
  <h1 id="heading"></h1>
  <p id="hint" class="hint"></p>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div id="list" class="list"></div>
  <script type="text/javascript" src="taskpane.js"></script>
</body>
</html>
